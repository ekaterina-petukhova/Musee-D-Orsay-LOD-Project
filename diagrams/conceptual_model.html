const tooltip = document.querySelector('.tooltip');
const nodeEls = [...document.querySelectorAll('.node')];
const edgeEls = [...document.querySelectorAll('.edge')];
// Zoom and pan act on the SVG viewBox: crisp vector graphics, no clipping.
const canvas = document.querySelector('.canvas');
const diagram = canvas.querySelector('svg');
const initialBox = diagram.viewBox.baseVal;
const original = {x:initialBox.x,y:initialBox.y,w:initialBox.width,h:initialBox.height};
let view = {...original};
const minZoom = 0.65, maxZoom = 10;
function applyView() {
  diagram.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
  document.getElementById('zoom-status').textContent = `${Math.round(original.w/view.w*100)}%`;
}
function zoom(factor,clientX,clientY) {
  const rect=diagram.getBoundingClientRect();
  const fx=clientX==null ? 0.5 : Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
  const fy=clientY==null ? 0.5 : Math.max(0,Math.min(1,(clientY-rect.top)/rect.height));
  const oldW=view.w, oldH=view.h;
  const z=Math.max(minZoom,Math.min(maxZoom,original.w/oldW*factor));
  const newW=original.w/z, newH=original.h/z;
  view.x += (oldW-newW)*fx;
  view.y += (oldH-newH)*fy;
  view.w=newW;view.h=newH;
  applyView();
}
document.getElementById('zoom-in').addEventListener('click',()=>zoom(1.35));
document.getElementById('zoom-out').addEventListener('click',()=>zoom(1/1.35));
document.getElementById('zoom-reset').addEventListener('click',()=>{view={...original};applyView();});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  zoom(Math.exp(-e.deltaY*0.0013), e.clientX,e.clientY);
},{passive:false});
let drag=null;
canvas.addEventListener('pointerdown',e=>{
 if(e.button!==0)return;
 drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};
 canvas.setPointerCapture(e.pointerId);
 canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove',e=>{
 if(!drag)return;
 const rect=diagram.getBoundingClientRect();
 view.x=drag.vx-(e.clientX-drag.x)*view.w/rect.width;
 view.y=drag.vy-(e.clientY-drag.y)*view.h/rect.height;
 applyView();
});
function stopDrag(){drag=null;canvas.classList.remove('dragging');}
canvas.addEventListener('pointerup',stopDrag);
canvas.addEventListener('pointercancel',stopDrag);


function connected(id) {
  const ids = new Set([id]);
  const rels = [];
  links.forEach((l,i) => {
    if (l.source === id || l.target === id) {
      ids.add(l.source); ids.add(l.target);
      const other = l.source === id ? l.target : l.source;
      const direction = l.source === id ? '\u2192' : '\u2190';
      rels.push(`${direction} ${l.label} \u00b7 ${nodeData[other].label}`);
    }
  });
  return {ids, rels};
}

function showNode(e,id) {
  const d=nodeData[id];
  const c=connected(id);
  nodeEls.forEach(el => {
    const eid=el.dataset.id;
    el.classList.toggle('active',eid===id);
    el.classList.toggle('dim',!c.ids.has(eid));
  });
  edgeEls.forEach((el,i) => {
    const l=links[i];
    const active=l.source===id || l.target===id;
    el.classList.toggle('active',active);
    el.classList.toggle('dim',!active);
  });
  tooltip.innerHTML =
    `<div class="tt-title">${d.label}</div>`+
    `<div class="tt-type">${d.type}</div>`+
    `<div class="tt-desc">${d.description}</div>`+
    (c.rels.length ? `<div class="tt-links">${c.rels.join('<br>')}</div>` : '');
  tooltip.classList.add('show');
  moveTooltip(e);
}

function moveTooltip(e) {
  const pad=16;
  let x=e.clientX+18, y=e.clientY+18;
  const rect=tooltip.getBoundingClientRect();
  if(x+rect.width>window.innerWidth-pad) x=e.clientX-rect.width-18;
  if(y+rect.height>window.innerHeight-pad) y=e.clientY-rect.height-18;
  tooltip.style.left=Math.max(pad,x)+'px';
  tooltip.style.top=Math.max(pad,y)+'px';
}

function clearAll() {
  nodeEls.forEach(el=>el.classList.remove('active','dim'));
  edgeEls.forEach(el=>el.classList.remove('active','dim'));
  tooltip.classList.remove('show');
}

nodeEls.forEach(el => {
  const id=el.dataset.id;
  el.addEventListener('mouseenter',e=>showNode(e,id));
  el.addEventListener('mousemove',moveTooltip);
  el.addEventListener('mouseleave',clearAll);
});
</script>
</body></html>
