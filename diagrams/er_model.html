<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Musée d’Orsay — E/R Model</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#f4f0e9;color:#302820;font-family:Arial,sans-serif}body{padding:12px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1300px;margin:0 auto 8px;flex-wrap:wrap}h1{font:500 24px Georgia,serif;margin:0}.hint{color:#746c61;font-size:12px;margin:5px 0}.controls{display:flex;align-items:center;gap:6px}.controls button{border:1px solid #cabda9;background:white;border-radius:6px;padding:7px 10px;font-size:14px;cursor:pointer}.controls output{min-width:44px;text-align:right;font-size:12px;color:#746c61}.canvas{height:550px;max-width:1300px;margin:auto;border:1px solid #e4dbcf;border-radius:10px;background:#f7f3ed;overflow:hidden;touch-action:none;cursor:grab}.canvas.dragging{cursor:grabbing}svg{display:block;width:100%;height:100%}.relation-line{stroke:#a7a19a;stroke-width:1.5}.attr-line{stroke:#d1cbc1;stroke-width:1.25;stroke-dasharray:4 5}.entity-label{font-size:13px;font-weight:700;fill:white;text-anchor:middle}.attr-circle{fill:#fcfbf8;stroke:#d8d2c9;stroke-width:1.5}.attr-label{font-size:11px;fill:#6d655b;text-anchor:middle}.edge-label{font-size:12px;fill:#655c52;text-anchor:middle;paint-order:stroke;stroke:#f7f3ed;stroke-width:6px;stroke-linejoin:round}.foot{max-width:1300px;margin:9px auto;color:#797064;font-size:11px}</style></head><body><div class="heading"><div><h1>Entity–Relationship Model</h1><p class="hint">Main entity types · relationships · representative attributes</p></div><div class="controls"><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button><button id="reset">Reset</button><output id="status">100%</output></div></div><div class="canvas" id="canvas"><svg id="diagram" viewBox="0 0 1200 920" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Entity relationship model with six entity types and associated attributes"><g id="scene"><line x1="570" y1="460" x2="880" y2="235" class="relation-line"/><text class="edge-label" x="732" y="332">designed by</text><line x1="570" y1="460" x2="958" y2="480" class="relation-line"/><text class="edge-label" x="764" y="453">involved in</text><line x1="570" y1="460" x2="760" y2="720" class="relation-line"/><text class="edge-label" x="627" y="590">located in</text><line x1="570" y1="460" x2="205" y2="460" class="relation-line"/><text class="edge-label" x="388" y="445">associated with</text><line x1="570" y1="460" x2="550" y2="185" class="relation-line"/><text class="edge-label" x="515" y="322">represents</text><line x1="958" y1="480" x2="760" y2="720" class="relation-line"/><text class="edge-label" x="891" y="600">took place in</text><line class="attr-line" x1="570" y1="460" x2="470" y2="365"/><line class="attr-line" x1="570" y1="460" x2="456" y2="460"/><line class="attr-line" x1="570" y1="460" x2="485" y2="550"/><line class="attr-line" x1="880" y1="235" x2="990" y2="162"/><line class="attr-line" x1="880" y1="235" x2="1000" y2="248"/><line class="attr-line" x1="880" y1="235" x2="890" y2="125"/><line class="attr-line" x1="958" y1="480" x2="1080" y2="440"/><line class="attr-line" x1="958" y1="480" x2="1075" y2="548"/><line class="attr-line" x1="760" y1="720" x2="860" y2="813"/><line class="attr-line" x1="760" y1="720" x2="650" y2="812"/><line class="attr-line" x1="205" y1="460" x2="113" y2="365"/><line class="attr-line" x1="205" y1="460" x2="105" y2="550"/><line class="attr-line" x1="550" y1="185" x2="457" y2="93"/><line class="attr-line" x1="550" y1="185" x2="655" y2="105"/><circle cx="570" cy="460" r="47" fill="#4b086c"/><text class="entity-label" x="570" y="465">MUSEUM</text><circle class="attr-circle" cx="470" cy="365" r="31"/><text class="attr-label" x="470" y="369">museum_id</text><circle class="attr-circle" cx="456" cy="460" r="31"/><text class="attr-label" x="456" y="464">name</text><circle class="attr-circle" cx="485" cy="550" r="31"/><text class="attr-label" x="485" y="554">opened</text><circle cx="880" cy="235" r="43" fill="#07518b"/><text class="entity-label" x="880" y="240">PERSON</text><circle class="attr-circle" cx="990" cy="162" r="31"/><text class="attr-label" x="990" y="166">person_id</text><circle class="attr-circle" cx="1000" cy="248" r="31"/><text class="attr-label" x="1000" y="252">name</text><circle class="attr-circle" cx="890" cy="125" r="31"/><text class="attr-label" x="890" y="129">role</text><circle cx="958" cy="480" r="43" fill="#917000"/><text class="entity-label" x="958" y="485">EVENT</text><circle class="attr-circle" cx="1080" cy="440" r="31"/><text class="attr-label" x="1080" y="444">event_id</text><circle class="attr-circle" cx="1075" cy="548" r="31"/><text class="attr-label" x="1075" y="552">name</text><circle cx="760" cy="720" r="43" fill="#087e41"/><text class="entity-label" x="760" y="725">PLACE</text><circle class="attr-circle" cx="860" cy="813" r="31"/><text class="attr-label" x="860" y="817">place_id</text><circle class="attr-circle" cx="650" cy="812" r="31"/><text class="attr-label" x="650" y="816">name</text><circle cx="205" cy="460" r="46" fill="#353536"/><text class="entity-label" x="205" y="465">ORGANISATION</text><circle class="attr-circle" cx="113" cy="365" r="31"/><text class="attr-label" x="113" y="369">organisation_id</text><circle class="attr-circle" cx="105" cy="550" r="31"/><text class="attr-label" x="105" y="554">name</text><circle cx="550" cy="185" r="43" fill="#963500"/><text class="entity-label" x="550" y="190">CONCEPT</text><circle class="attr-circle" cx="457" cy="93" r="31"/><text class="attr-label" x="457" y="97">concept_id</text><circle class="attr-circle" cx="655" cy="105" r="31"/><text class="attr-label" x="655" y="109">term</text></g></svg></div><div class="foot">Simplified model; full entity descriptions and triples appear in Items Description and RDF Production.</div><script>
const svg=document.getElementById('diagram'),scene=document.getElementById('scene'),canvas=document.getElementById('canvas'),status=document.getElementById('status');let scale=1,tx=0,ty=0,drag=null;
function render(){scene.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);status.textContent=Math.round(scale*100)+'%'}
function zoom(f,cx=600,cy=460){let old=scale;scale=Math.min(3,Math.max(.7,scale*f));let k=scale/old;tx=cx-(cx-tx)*k;ty=cy-(cy-ty)*k;render()}
document.getElementById('plus').onclick=()=>zoom(1.2);document.getElementById('minus').onclick=()=>zoom(1/1.2);document.getElementById('reset').onclick=()=>{scale=1;tx=0;ty=0;render()};
function point(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
canvas.addEventListener('wheel',e=>{e.preventDefault();const p=point(e);zoom(e.deltaY<0?1.12:1/1.12,p.x,p.y)},{passive:false});
canvas.addEventListener('pointerdown',e=>{let p=point(e);drag={x:p.x,y:p.y,tx,ty};canvas.classList.add('dragging');canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;let p=point(e);tx=drag.tx+p.x-drag.x;ty=drag.ty+p.y-drag.y;render()});
for(const typ of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(typ,()=>{drag=null;canvas.classList.remove('dragging')});render();
</script></body></html>
